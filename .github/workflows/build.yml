name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_OWN_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Los runners ubuntu-latest ya traen el SDK de Android (ANDROID_HOME); AGP descarga lo que falte.
      - uses: gradle/actions/setup-gradle@v4

      # Modelo CLIP para analizar fotos en el móvil (~89 MB). No está en git: se descarga y se guarda en caché.
      - uses: actions/cache@v4
        with:
          path: app/src/main/assets/clip/vision_model_quantized.onnx
          key: clip-vit-base-patch32-vision-quantized-v1

      - name: Download on-device AI model
        run: |
          MODEL=app/src/main/assets/clip/vision_model_quantized.onnx
          if [ ! -s "$MODEL" ]; then
            curl -sSfL --retry 3 -o "$MODEL" \
              https://huggingface.co/Xenova/clip-vit-base-patch32/resolve/main/onnx/vision_model_quantized.onnx
          fi
          test "$(stat -c %s "$MODEL")" -gt 80000000

      - name: Decode own signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.HAS_OWN_KEYSTORE == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk "clothify-v${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: clothify-v${{ github.run_number }}
          path: clothify-v${{ github.run_number }}.apk

      - name: Publish release
        if: github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Clothify v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: clothify-v${{ github.run_number }}.apk
          body: |
            Descarga `clothify-v${{ github.run_number }}.apk` en tu móvil Android y ábrelo para instalar o actualizar.
